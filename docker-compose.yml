version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - auth-service
      - leetcode-service
      - interview-service
      - ai-service
    env_file:
      - .env

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "3002:3002"
    env_file:
      - .env

  leetcode-service:
    build:
      context: .
      dockerfile: services/leetcode-service/Dockerfile
    ports:
      - "3003:3003"
    env_file:
      - .env

  interview-service:
    build:
      context: .
      dockerfile: services/interview-service/Dockerfile
    ports:
      - "3004:3004"
    env_file:
      - .env

  ai-service:
    build:
      context: .
      dockerfile: services/ai-service/Dockerfile
    ports:
      - "3005:3005"
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    # Frontend will communicate via localhost to API gateway on host machine, or through Nginx reverse proxy
