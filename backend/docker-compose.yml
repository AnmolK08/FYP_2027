services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    environment:
      NODE_ENV: development

      # Neon PostgreSQL
      DATABASE_URL: ${DATABASE_URL}

      # Redis inside Docker Compose
      REDIS_URL: redis://redis:6379

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      - redis

    volumes:
      - .:/app
      - /app/node_modules

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    volumes:
      - redisdata:/data

    restart: unless-stopped

volumes:
  redisdata: